; MXReflexFix configuration. Values are true/false or numbers.

[Fix Resolution]
; Render the 3D scene at the full screen resolution instead of a pillarboxed 16:9 box.
; Aspect ratio and HUD fixes below need this.
Enabled = true

[Fix Aspect Ratio]
; Hor+ projection for the screen aspect ratio (wider view, no vertical crop).
Enabled = true

[FOV]
; Multiplier for the vertical FOV of gameplay cameras. 1.0 = game default.
Multiplier = 1.0

[Fix HUD]
; Keep the HUD, menus and videos at 16:9, centered. Also fixes mouse picking in menus.
Enabled = true
; Black bars beside the 16:9 area while in the front-end menus (gameplay stays full width).
MenuBlackBars = true
; Same black bars while the game is paused.
PauseBlackBars = true

[Intro Skip]
; Skip the startup logo videos.
Enabled = true
; Comma-separated .bik base names from the Videos folder. Every video the game opens is
; written to MXReflexFix.log, so you can add or remove names here.
Videos = Nordic_Logo_wSound,Rainbow_Logo_wSound,DHLogo

[Framerate]
; Replace the game's 60 fps cap.
Unlock = true
; 0 = ScreenRefresh from graphics.cfg, -1 = uncapped, any other number = that fps.
Cap = 0
